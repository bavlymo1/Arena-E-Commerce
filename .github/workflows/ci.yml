name: ArenaPass CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      # Android debug flavor builds are deferred until Firebase flavor configs stabilize.

  firestore_rules:
    name: Firestore Rules & Emulator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'firebase/rules_test/package-lock.json'
      - name: Check emulator seed fixtures
        run: node --test firebase/seed/seed.test.mjs
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.35.0
      - name: Install rules test dependencies & run emulator tests
        run: cd firebase/rules_test && npm ci && npm run test:emulator
