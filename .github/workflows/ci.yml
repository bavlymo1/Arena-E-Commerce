name: ArenaPass CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve app directory
        id: layout
        run: |
          if [ -f pubspec.yaml ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f e_commerce_project/pubspec.yaml ]; then
            echo "dir=e_commerce_project" >> "$GITHUB_OUTPUT"
          else
            echo "pubspec.yaml not found at . or e_commerce_project" >&2
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        working-directory: ${{ steps.layout.outputs.dir }}
        run: flutter pub get
      - name: Check formatting
        working-directory: ${{ steps.layout.outputs.dir }}
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: ${{ steps.layout.outputs.dir }}
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: ${{ steps.layout.outputs.dir }}
        run: flutter test
      # Android debug flavor builds are deferred until Firebase flavor configs stabilize.

  firestore_rules:
    name: Firestore Rules & Emulator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve app directory
        id: layout
        run: |
          if [ -f firebase/rules_test/package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f e_commerce_project/firebase/rules_test/package.json ]; then
            echo "dir=e_commerce_project" >> "$GITHUB_OUTPUT"
          else
            echo "firebase/rules_test/package.json not found at . or e_commerce_project" >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/firebase/rules_test/package-lock.json'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install rules test dependencies & run emulator tests
        working-directory: ${{ steps.layout.outputs.dir }}
        run: cd firebase/rules_test && npm ci && npm run test:emulator
